name: Build Hirad Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure Android Platform Files
        working-directory: ./hirad_flutter
        run: |
          cp pubspec.yaml pubspec.backup.yaml
          flutter create --platforms=android --project-name hirad_flutter --org com.hirad.fitness . || true
          cp pubspec.backup.yaml pubspec.yaml
          rm -f test/widget_test.dart

      - name: Install Dependencies
        working-directory: ./hirad_flutter
        run: flutter pub get

      - name: Run Unit Tests
        working-directory: ./hirad_flutter
        run: flutter test test/jalali_test.dart test/validation_test.dart

      - name: Build Release APK
        working-directory: ./hirad_flutter
        run: flutter build apk --release

      - name: Prepare Release APK File
        run: |
          cp hirad_flutter/build/app/outputs/flutter-apk/app-release.apk Hirad-Fitness-Club-v1.1.0.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hirad-Fitness-Club-Release-APK
          path: Hirad-Fitness-Club-v1.1.0.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: "اپلیکیشن باشگاه هیراد نسخه 1.1.0 (Hirad Fitness APK v1.1.0)"
          draft: false
          prerelease: false
          body: |
            ## اپلیکیشن مدیریت باشگاه بدنسازی هیراد (نسخه ۱.۱.۰)

            فایل نصبی اندروید (APK) کاملاً بومی و نیتیو (Flutter).

            ### 🚀 تغییرات و قابلیت‌های جدید نسخه ۱.۱.۰:
            - ⚡ **انتخاب فوق‌سریع و جستجوی سال تولد:** امکان تایپ مستقیم سال (مثلاً ۱۳۶۵) و دکمه‌های پرش مستقیم به دهه‌های ۵۰، ۶۰، ۷۰، ۸۰ بدون نیاز به اسکرول طولانی.
            - 📱 **اصلاح نمایش کیبورد در بخش شهریه:** عدم پوشش فیلدها، اسکرول خودکار هنگام باز شدن کیبورد و شمارنده زنده ارقام به حروف و تومان.
            - 💳 **ساختار کامل حسابداری و سوابق پرداخت:** تفکیک شهریه ماه جاری، کل مبالغ پرداخت‌شده، محاسبه خودکار مانده بدهی و امکان ثبت پرداخت جدید بدون پاک شدن سوابق قبلی.
            - ⏱️ **ثبت سریع حضور و غیاب با کد ملی:** ثبت فوری ورود ورزشکار در درب باشگاه ظرف ۳ ثانیه تنها با وارد کردن کد ملی بدون نیاز به پیمایش صفحات مختلف.
            - 📋 **ثبت و محاسبه سوابق جلسات حضور:** شمارنده هوشمند تعداد جلسات، ثبت دقیق تاریخ و ساعت جلسات و امکان مدیریت سوابق.
            - 🖼️ **امکان آپلود و تغییر عکس پروفایل:** انتخاب و تعویض عکس ورزشکار مستقیماً از حافظه و گالری گوشی توسط مربی.

            ---
            ### ⬇️ دانلود مستقیم فایل نصبی:
            فایل **`Hirad-Fitness-Club-v1.1.0.apk`** را از بخش Assets در زیر دانلود کرده و روی گوشی اندروید نصب کنید.
          files: Hirad-Fitness-Club-v1.1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
