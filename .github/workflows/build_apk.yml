name: Build Hirad Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure Android Platform Files
        working-directory: ./hirad_flutter
        run: |
          cp pubspec.yaml pubspec.backup.yaml
          flutter create --platforms=android --project-name hirad_flutter --org com.hirad.fitness . || true
          cp pubspec.backup.yaml pubspec.yaml
          rm -f test/widget_test.dart
          # Overwrite default launcher icons with custom Hirad logo
          cp -r res_icons/* android/app/src/main/res/ || true

      - name: Install Dependencies
        working-directory: ./hirad_flutter
        run: flutter pub get

      - name: Run Unit Tests
        working-directory: ./hirad_flutter
        run: flutter test test/jalali_test.dart test/validation_test.dart

      - name: Build Release APK
        working-directory: ./hirad_flutter
        run: flutter build apk --release

      - name: Prepare Release APK File
        run: |
          cp hirad_flutter/build/app/outputs/flutter-apk/app-release.apk Hirad-Fitness-Club-v1.2.0.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hirad-Fitness-Club-Release-APK
          path: Hirad-Fitness-Club-v1.2.0.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: "اپلیکیشن باشگاه هیراد نسخه 1.2.0 (Hirad Fitness APK v1.2.0)"
          draft: false
          prerelease: false
          body: |
            ## اپلیکیشن مدیریت باشگاه بدنسازی هیراد (نسخه ۱.۲.۰)

            فایل نصبی اندروید (APK) کاملاً بومی و نیتیو (Flutter) با آیکون اختصاصی جدید باشگاه.

            ### 🚀 تغییرات و قابلیت‌های جدید نسخه ۱.۲.۰:
            - 🌟 **آیکون رسمی جدید باشگاه:** جایگزینی آیکون اپلیکیشن با نشان اختصاصی فیگور بدنسازی باشگاه هیراد.
            - 👤 **درج نام «مربی: عبداللهی»:** نمایش رسمی هویت مربی در سربرگ اصلی اپلیکیشن.
            - 💳 **ذخیره کامل سوابق پرداخت شهریه داخل حساب ورزشکار:** امکان ثبت تاریخ شمسی پرداخت (مثلاً ۲۵/۰۶/۱۴۰۵)، مبلغ پرداختی و وضعیت «پرداخت‌شده» به صورت رکوردهای مجزا در تاریخچه مالی ورزشکار بدون حذف سوابق قبلی.
            - ⚡ **انتخاب فوق‌سریع سال تولد با دهه‌ها و جستجوی مستقیم.**
            - 📱 **اصلاح کیبورد و دید کامل ارقام در بخش شهریه.**
            - ⏱️ **ثبت سریع حضور و غیاب با کد ملی در صفحه اصلی.**
            - 📋 **ثبت و محاسبه سوابق جلسات حضور هر ورزشکار.**

            ---
            ### ⬇️ دانلود مستقیم فایل نصبی:
            فایل **`Hirad-Fitness-Club-v1.2.0.apk`** را از بخش Assets در زیر دانلود کرده و روی گوشی اندروید نصب کنید.
          files: Hirad-Fitness-Club-v1.2.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
