name: Build Hirad Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure Android Platform Files
        working-directory: ./hirad_flutter
        run: |
          cp pubspec.yaml pubspec.backup.yaml
          flutter create --platforms=android --project-name hirad_flutter --org com.hirad.fitness . || true
          cp pubspec.backup.yaml pubspec.yaml
          rm -f test/widget_test.dart
          # Overwrite default launcher icons with custom Hirad logo
          cp -r res_icons/* android/app/src/main/res/ || true

      - name: Install Dependencies
        working-directory: ./hirad_flutter
        run: flutter pub get

      - name: Run Unit Tests
        working-directory: ./hirad_flutter
        run: flutter test test/jalali_test.dart test/validation_test.dart

      - name: Build Release APK
        working-directory: ./hirad_flutter
        run: flutter build apk --release

      - name: Prepare Release APK File
        run: |
          cp hirad_flutter/build/app/outputs/flutter-apk/app-release.apk Hirad-Fitness-Club-v1.3.0.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hirad-Fitness-Club-Release-APK
          path: Hirad-Fitness-Club-v1.3.0.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.0
          name: "اپلیکیشن باشگاه هیراد نسخه 1.3.0 (Hirad Fitness APK v1.3.0)"
          draft: false
          prerelease: false
          body: |
            ## اپلیکیشن مدیریت باشگاه بدنسازی هیراد (نسخه ۱.۳.۰)

            فایل نصبی اندروید (APK) کاملاً بومی و نیتیو (Flutter) به همراه ارتقای جامع رابط کاربری، اعتبارسنجی‌ها و استانداردهای طراحی.

            ### 🚀 تغییرات و قابلیت‌های جدید نسخه ۱.۳.۰:
            - 🔢 **یکپارچه‌سازی ارقام فارسی:** نمایش سراسری تاریخ‌ها، مبالغ، کدهای ملی، شماره‌های تماس و شمارنده‌ها با اعداد فارسی (۰۱۲۳۴۵۶۷۸۹).
            - 🎯 **استانداردسازی نوار ابزار (هدر):** حداکثر ۴ کنترل استاندارد ۴۴ پیکسلی با دسترسی مستقیم و آسان به حالت شب/روز.
            - 📋 **منوی کشویی امکانات و مرتب‌سازی:** دسترسی آسان به ابزارهای تازه‌سازی داده‌ها و دانلود نسخه جدید با متن و آیکون خوانا.
            - ⚡ **ثبت سریع و هوشمند حضور و غیاب:** ثبت خودکار بلافاصله پس از ۱۰ رقم کد ملی به همراه تایمر ۵ ثانیه‌ای لغو (Undo) و هشدار ثبت تکراری.
            - 🛡️ **اعتبارسنجی دقیق کد ملی:** فرمول رسمی ده رقمی تقسیم بر ۱۱ (Modulo 11) برای جلوگیری از ثبت کدهای نادرست.
            - 💰 **قالب‌بندی استاندارد مبالغ:** جداسازی سه‌رقمی، درج فاصله استاندارد قبل از تومان و تفکیک دکمه‌های مالی و تماس/واتساپ.
            - 📅 **تقویم پویای سال جاری و انتخاب سریع تاریخ:** انتخاب سریع دیروز و امروز و پرش ساده به دهه‌ها برای انتخاب تاریخ تولد.

            ---
            ### ⬇️ دانلود مستقیم فایل نصبی:
            فایل **`Hirad-Fitness-Club-v1.3.0.apk`** را از بخش Assets در زیر دانلود کرده و روی گوشی اندروید نصب کنید.
          files: Hirad-Fitness-Club-v1.3.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
