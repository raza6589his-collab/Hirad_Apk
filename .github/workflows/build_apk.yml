name: Build Hirad Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure Android Platform Files
        working-directory: ./hirad_flutter
        run: |
          cp pubspec.yaml pubspec.backup.yaml
          flutter create --platforms=android --project-name hirad_flutter --org com.hirad.fitness .
          cp pubspec.backup.yaml pubspec.yaml

      - name: Install Dependencies
        working-directory: ./hirad_flutter
        run: flutter pub get

      - name: Run Unit Tests
        working-directory: ./hirad_flutter
        run: flutter test

      - name: Build Release APK
        working-directory: ./hirad_flutter
        run: flutter build apk --release

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hirad-Fitness-Club-Release-APK
          path: hirad_flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
